<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // Neutralize Vite HMR WebSocket in cloud environment to eliminate connection errors
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && url.indexOf('token=') !== -1)) {
              var target = new EventTarget();
              target.readyState = 1; // WebSocket.OPEN
              target.url = url;
              target.protocol = protocols;
              target.send = function() {};
              target.close = function() {};
              setTimeout(function() {
                target.dispatchEvent(new Event('open'));
              }, 0);
              return target;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // Suppress benign Vite HMR WebSocket warnings and module runner rejections in cloud preview
        function isBenignViteWsError(msg) {
          if (!msg) return false;
          var str = typeof msg === 'string' ? msg : (msg.message || msg.stack || String(msg));
          return (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('failed to connect to websocket') !== -1 ||
            str.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            str.indexOf('@vite/client') !== -1
          );
        }

        var origWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { return typeof a === 'object' ? (a && a.message) || JSON.stringify(a) : String(a); }).join(' ');
          if (isBenignViteWsError(joined) || joined.indexOf('Could not fetch unread messages count') !== -1 || joined.indexOf('Could not fetch live bookings') !== -1) {
            return;
          }
          origWarn.apply(console, arguments);
        };

        var origError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { return typeof a === 'object' ? (a && a.message) || JSON.stringify(a) : String(a); }).join(' ');
          if (isBenignViteWsError(joined)) {
            return;
          }
          origError.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (isBenignViteWsError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        window.addEventListener('error', function(event) {
          var text = (event.message || '') + ' ' + (event.filename || '');
          if (isBenignViteWsError(text) || isBenignViteWsError(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        });
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/nurses-pillow-logo.png" />
    <title>Nurses Pillow</title>
    <meta name="description" content="Sanctuary-grade travel nurse housing marketplace and clinical credentialing verification portal." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <meta property="og:title" content="Nurses Pillow" />
    <meta property="og:description" content="Sanctuary-grade travel nurse housing marketplace and clinical credentialing verification portal." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#faf8ff] text-[#001848] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        // Fallback to immediately showing fonts if JS fonts API fails or is slow
        document.documentElement.classList.add("fonts-loaded");
      })();
    </script>
    <script>
      (function () {
        if (/eruda=true/.test(window.location.search)) {
          var script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/npm/eruda';
          document.body.appendChild(script);
          script.onload = function () {
            eruda.init();
          }
        }
      })();
    </script>
  </body>
</html>
